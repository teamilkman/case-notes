name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "public/**"
      - "tools/pack-android-shell.mjs"
      - "tools/vendor-dexie.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/**"
      - "tools/pack-android-shell.mjs"
      - "tools/vendor-dexie.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      offline-check-failed: ${{ steps.verdict.outputs.failed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
      - name: Build and test the debug variant
        run: gradle :app:assembleDebug :app:testDebugUnitTest --project-dir android
      # The packaged shell must render with no network at all, including after the
      # activity (and its WebView) is recreated. The retry step re-runs the check on
      # a fresh emulator only when this attempt failed; `continue-on-error` keeps the
      # job running, and a marker file carries the verdict to the retry condition
      # because `outcome` is unreliable on steps with `continue-on-error`.
      - name: Verify APK cold start without network
        id: offline-cold-start
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with: &offline-check
          api-level: 34
          # An Automated Test Device image drops GMS, the bundled UI apps and SystemUI,
          # which keeps the guest small enough to finish the recreation step.
          target: aosp_atd
          arch: x86_64
          profile: Nexus S
          heap-size: 512M
          # `ram-size` lands in hw.ramSize as written and is rejected by this image, so
          # the emulator flag sets the guest memory instead.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 4096
          emulator-boot-timeout: 300
          disable-animations: true
          disable-spellchecker: true
          script: |
            # An ATD image has no telephony stack, so disabling mobile data returns
            # non-zero; the test itself asserts that no network is active.
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell cmd connectivity airplane-mode enable || true
            gradle :app:connectedDebugAndroidTest --project-dir android
      - name: Record the offline check verdict
        id: verdict
        if: always()
        run: |
          if test "${{ steps.offline-cold-start.outcome }}" = success; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify APK cold start without network (retry)
        if: steps.verdict.outputs.failed == 'true'
        continue-on-error: false
        uses: reactivecircus/android-emulator-runner@v2
        with: *offline-check
      - name: Report Android test failures inline
        if: failure()
        run: |
          shopt -s nullglob
          for file in android/app/build/outputs/androidTest-results/connected/debug/*.xml \
                      android/app/build/outputs/androidTest-results/connected/debug/*/testlog/test-results.log; do
            echo "===== $file"
            tail -n 120 "$file"
          done
      - name: Preserve isolated Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-offline-failure
          path: android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - name: Decode signing keystore
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Assemble APKs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug :app:assembleRelease --project-dir android
          cp android/app/build/outputs/apk/debug/app-debug.apk case-notes-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk case-notes-release.apk
          ls -lh case-notes-debug.apk case-notes-release.apk
      - name: Verify release signature
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs case-notes-release.apk
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: case-notes-apk
          path: |
            case-notes-debug.apk
            case-notes-release.apk
      - name: Publish to rolling Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-latest
          name: Android APK (latest)
          body: |
            main 分支滚动构建，提交 `${{ github.sha }}`。
            下载 `case-notes-release.apk` 使用新包名安装；后续版本可覆盖升级（固定签名）；`case-notes-debug.apk` 为调试包。
          make_latest: false
          files: |
            case-notes-release.apk
            case-notes-debug.apk
