name: Build Android APK

# Quality gate only: build, unit tests and the offline emulator check. It never
# signs or publishes; that lives in the separate release workflow so a flaky
# emulator node cannot delay a release.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "public/**"
      - "tools/pack-android-shell.mjs"
      - "tools/vendor-dexie.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/**"
      - "tools/pack-android-shell.mjs"
      - "tools/vendor-dexie.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
      - name: Enable emulator acceleration
        run: |
          # The official rule set for hosted runners. Without it /dev/kvm is not
          # accessible, and the guest boots in minutes instead of tens of seconds.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Build and test the debug variant
        run: gradle :app:assembleDebug :app:testDebugUnitTest --project-dir android
      # The packaged shell must render with no network at all, including after the
      # activity (and its WebView) is recreated. The retry step re-runs the check on
      # a fresh emulator only when this attempt failed; `continue-on-error` keeps the
      # job running, and the verdict step carries the decision because `outcome` is
      # unreliable on steps with `continue-on-error`.
      - name: Verify APK cold start without network
        id: offline-cold-start
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with: &offline-check
          api-level: 34
          # An Automated Test Device image drops GMS, the bundled UI apps and SystemUI,
          # which keeps the guest small enough to finish the recreation step.
          target: aosp_atd
          arch: x86_64
          profile: Nexus S
          heap-size: 512M
          # `ram-size` lands in hw.ramSize as written and is rejected by this image, so
          # the emulator flag sets the guest memory instead.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 4096
          emulator-boot-timeout: 300
          disable-animations: true
          disable-spellchecker: true
          script: |
            # An ATD image has no telephony stack, so disabling mobile data returns
            # non-zero; the test itself asserts that no network is active.
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            adb shell cmd connectivity airplane-mode enable || true
            adb logcat -c
            # A wedged guest (adb half-dead, gradle hung) must fail fast into the
            # retry step instead of burning the 30-minute job limit.
            timeout -k 30 480 gradle :app:connectedDebugAndroidTest --project-dir android; code=$?
            # The action's own capture window is too narrow; keep the whole system log.
            adb logcat -d > android/app/build/outputs/androidTest-results/connected/full-logcat.txt || true
            exit $code
      - name: Record the offline check verdict
        id: verdict
        if: always()
        run: |
          # `conclusion` reports the tolerated success on a continue-on-error step,
          # while `outcome` keeps the raw value; gate the retry on the raw value.
          if test "${{ steps.offline-cold-start.conclusion }}" = success; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify APK cold start without network (retry)
        if: steps.verdict.outputs.failed == 'true'
        continue-on-error: false
        uses: reactivecircus/android-emulator-runner@v2
        with: *offline-check
      - name: Report Android test failures inline
        if: failure()
        run: |
          shopt -s nullglob
          for file in android/app/build/outputs/androidTest-results/connected/debug/*.xml \
                      android/app/build/outputs/androidTest-results/connected/debug/*/testlog/test-results.log; do
            echo "===== $file"
            tail -n 120 "$file"
          done
          if [ -f android/app/build/outputs/androidTest-results/connected/full-logcat.txt ]; then
            echo "===== full logcat (crash/FATAL/test lines)"
            grep -E 'FATAL|SIGSEGV|SIGTRAP|SIGABRT|Render process|Process crashed|Force finishing|AndroidRuntime|OfflineShellTest|casenotes.*(died|crash)' \
              android/app/build/outputs/androidTest-results/connected/full-logcat.txt | tail -n 80 || true
          fi
      - name: Preserve isolated Android failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-offline-failure
          path: |
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/androidTest-results/connected/full-logcat.txt
          if-no-files-found: ignore
