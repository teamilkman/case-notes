name: Android quality check

# Build and JVM unit tests for the WebView shell, on Android changes and on
# demand. The offline emulator check that used to live here is gone: on
# GitHub-hosted runners the guest kept dying mid-test (the emulator process
# exits with no output and port 5554 refuses connections) across GPU modes and
# API images, so the signal was never green and every run ended red. The shell's
# paths, MIME types and allow rules stay covered by BundledShellTest
# (Robolectric) and tests/android-shell.test.ts.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
      - name: Build and test the debug variant
        run: gradle :app:assembleDebug :app:testDebugUnitTest --project-dir android
